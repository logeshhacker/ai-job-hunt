# Render Blueprint — defines both the web service and PostgreSQL database.
# Docs: https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this file to your GitHub repo at deploy/render/render.yaml
#      (or copy it to the repo root as render.yaml — Render checks both).
#   2. Render Dashboard → New → Blueprint → connect your repo.
#   3. Render will create the web service and the PostgreSQL instance automatically.
#
# See docs/deployment/free-hosting-alternatives.md for full setup instructions.

services:
  - type: web
    name: ai-job-hunt-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend wsgi:app --log-file -
    healthCheckPath: /api/auth/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-job-hunt-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://ai-job-hunt-api.onrender.com

databases:
  - name: ai-job-hunt-db
    databaseName: aijobhunt
    plan: free
    region: oregon
